name: setup-check
on:
  push:
    branches: [ccr-e2db22b6-c9mmdm]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-calls:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch a food photo
        run: |
          for n in Nasi_lemak.jpg Nasi_Lemak.jpg Nasi_goreng.jpg Satay.jpg; do
            curl -sL -A "countmakan-check/1.0" -o food.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/$n?width=640" && file food.jpg | grep -q JPEG && { echo "using $n"; break; }
          done
          file food.jpg; ls -l food.jpg
          base64 -w0 food.jpg > food.b64
      - name: Gemini inline_data + responseSchema
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for M in gemini-3.8-flash gemini-3.5-flash-lite; do
            jq -n --rawfile b food.b64 '{
              contents:[{parts:[{text:"Estimate the food in this photo. Return JSON."},{inline_data:{mime_type:"image/jpeg",data:($b|rtrimstr("\n"))}}]}],
              generationConfig:{responseMimeType:"application/json",responseSchema:{type:"OBJECT",properties:{items:{type:"ARRAY",items:{type:"OBJECT",properties:{name:{type:"STRING"},grams:{type:"NUMBER"},kcal:{type:"NUMBER"},protein:{type:"NUMBER"},carbs:{type:"NUMBER"},fat:{type:"NUMBER"},confidence:{type:"NUMBER"}},required:["name","grams","kcal","protein","carbs","fat","confidence"]}}},required:["items"]}}}' > g.json
            code=$(curl -s -o gr.json -w '%{http_code}' -H "x-goog-api-key: $K" -H 'content-type: application/json' --data @g.json "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent")
            echo "== $M http=$code"
            jq -c '{text:.candidates[0].content.parts[0].text, usage:.usageMetadata, err:.error.message}' gr.json | cut -c1-1500
          done
      - name: DeepSeek image + json mode
        env:
          K: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          for M in deepseek-flash deepseek-v4-pro; do
            jq -n --arg m "$M" --rawfile b food.b64 '{model:$m,response_format:{type:"json_object"},
              messages:[{role:"system",content:"Return JSON: {\"items\":[{\"name\":str,\"grams\":num,\"kcal\":num,\"protein\":num,\"carbs\":num,\"fat\":num,\"confidence\":num}]}"},
                {role:"user",content:[{type:"text",text:"Estimate the food in this photo."},{type:"image_url",image_url:{url:("data:image/jpeg;base64,"+($b|rtrimstr("\n")))}}]}]}' > d.json
            code=$(curl -s -o dr.json -w '%{http_code}' -H "Authorization: Bearer $K" -H 'content-type: application/json' --data @d.json https://api.deepseek.com/chat/completions)
            echo "== $M http=$code"
            jq -c '{text:.choices[0].message.content, usage:.usage, err:.error}' dr.json | cut -c1-1500
          done
      - name: DeepSeek text-only json mode
        env:
          K: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          code=$(curl -s -o t.json -w '%{http_code}' -H "Authorization: Bearer $K" -H 'content-type: application/json' \
            -d '{"model":"deepseek-flash","response_format":{"type":"json_object"},"messages":[{"role":"user","content":"Estimate calories for: 1 plate nasi lemak with fried chicken. Return json {items:[{name,grams,kcal,protein,carbs,fat,confidence}]}"}]}' \
            https://api.deepseek.com/chat/completions)
          echo "http=$code"; jq -c '{text:.choices[0].message.content, err:.error}' t.json | cut -c1-1500
