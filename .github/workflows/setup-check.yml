name: setup-check
on:
  push:
    branches: [ccr-e2db22b6-c9mmdm]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets present (true/false only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASSCODE: ${{ secrets.PASSCODE }}
        run: |
          for n in GEMINI_API_KEY DEEPSEEK_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PASSCODE; do
            if [ -n "${!n}" ]; then echo "$n=present"; else echo "$n=MISSING"; fi
          done
      - name: Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/pages" --jq '"build_type=\(.build_type) url=\(.html_url)"' || echo "pages=NOT_CONFIGURED"
      - name: Gemini key works + Flash model ids
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -z "$K" ] && { echo "skip"; exit 0; }
          code=$(curl -s -o g.json -w '%{http_code}' -H "x-goog-api-key: $K" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200")
          echo "gemini_models_http=$code"
          jq -r '.models[]?.name' g.json | grep -i flash | grep -vi -e image -e tts -e audio -e live || true
          jq -r '.error.message? // empty' g.json
      - name: DeepSeek key works + model ids + browser CORS
        env:
          K: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          [ -z "$K" ] && { echo "skip"; exit 0; }
          code=$(curl -s -o d.json -w '%{http_code}' -H "Authorization: Bearer $K" https://api.deepseek.com/models)
          echo "deepseek_models_http=$code"
          jq -r '.data[]?.id' d.json
          jq -r '.error.message? // empty' d.json
          echo "--- CORS preflight from Pages origin:"
          curl -s -i -X OPTIONS https://api.deepseek.com/chat/completions \
            -H "Origin: https://hariadityaa.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            | grep -i -e '^HTTP' -e '^access-control' || true
