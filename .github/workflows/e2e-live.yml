name: e2e-live
# Real model calls against the deployed site. Manual only: each run spends
# about 4 Gemini Flash calls from a ~20/day free quota, and DeepSeek credit on fallback.
on:
  workflow_dispatch:
    inputs:
      expect_sha:
        description: Fail unless the live sw.js carries this commit (optional)
        required: false
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run live suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXPECT_SHA: ${{ inputs.expect_sha }}
          LIVE_OUT: ${{ github.workspace }}/live-results
        run: npx playwright test -c tests/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-results
          path: live-results/
