<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health API spike</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 16px; max-width: 640px; background: #fff; color: #111; }
  input, button { font: inherit; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  pre { background: #f3f3f3; padding: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<h1>Google Health API spike</h1>
<p>Temporary page. Writes one test meal to Google Health, then reads it back.</p>
<label>OAuth client ID <input id="cid" placeholder="123-abc.apps.googleusercontent.com"></label>
<button id="connect">1. Connect Google</button>
<button id="write" disabled>2. Write test meal (123 kcal)</button>
<button id="list" disabled>3. List my nutrition logs</button>
<button id="del" disabled>4. Delete test meals</button>
<pre id="out"></pre>
<script>
const API = 'https://health.googleapis.com/v4/users/me/dataTypes/nutrition-log/dataPoints';
const SCOPE = 'https://www.googleapis.com/auth/googlehealth.nutrition.writeonly';
const $ = (id) => document.getElementById(id);
const log = (label, v) => { $('out').textContent = `${label}\n${typeof v === 'string' ? v : JSON.stringify(v, null, 2)}\n\n` + $('out').textContent; };
let token = null;
let testNames = [];

try { $('cid').value = localStorage.getItem('spike-cid') || ''; } catch { /* storage blocked */ }

async function call(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = text; }
  log(`${method} → HTTP ${res.status}`, data);
  return data;
}

$('connect').onclick = () => {
  const cid = $('cid').value.trim();
  if (!cid) return log('Error', 'Paste the client ID first.');
  try { localStorage.setItem('spike-cid', cid); } catch { /* storage blocked */ }
  google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: SCOPE,
    callback: (r) => {
      if (r.error) return log('OAuth error', r);
      token = r.access_token;
      log('Connected', { scope: r.scope, expires_in: r.expires_in });
      ['write', 'list', 'del'].forEach((id) => { $(id).disabled = false; });
    },
    error_callback: (e) => log('OAuth popup error', e),
  }).requestAccessToken();
};

$('write').onclick = async () => {
  const end = new Date();
  const start = new Date(end.getTime() - 60_000);
  const offset = `${-end.getTimezoneOffset() * 60}s`;
  const g = (grams) => ({ grams });
  const res = await call('POST', API, {
    nutritionLog: {
      interval: { startTime: start.toISOString(), endTime: end.toISOString(), startUtcOffset: offset, endUtcOffset: offset },
      foodDisplayName: 'countmakan test meal',
      mealType: 'SNACK',
      energy: { kcal: 123 },
      totalCarbohydrate: g(15),
      totalFat: g(4),
      nutrients: [{ nutrient: 'PROTEIN', quantity: g(7) }],
    },
  });
  const name = res?.response?.name || res?.name;
  if (name && name.includes('/dataPoints/')) testNames.push(name);
};

$('list').onclick = async () => {
  const res = await call('GET', `${API}?pageSize=20`);
  const pts = res?.dataPoints || [];
  testNames = pts.filter((p) => p.nutritionLog?.foodDisplayName === 'countmakan test meal').map((p) => p.name).filter(Boolean);
  log('Test meals found', testNames);
};

$('del').onclick = async () => {
  if (!testNames.length) return log('Delete', 'Nothing to delete. Tap "List" first.');
  await call('POST', `${API}:batchDelete`, { names: testNames });
  testNames = [];
};
</script>
</body>
</html>
